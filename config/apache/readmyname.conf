# Apache Virtual Host Configuration for Read My Name
# File: /opt/bitnami/apache/conf/vhosts/readmyname.conf
#
# This should be included in your main Apache configuration
# Add this line to /opt/bitnami/apache/conf/bitnami/bitnami.conf:
# Include "/opt/bitnami/apache/conf/vhosts/readmyname.conf"

# Production Virtual Host - www.aidsquilttouch.org/readmyname
<VirtualHost *:80>
    ServerName www.aidsquilttouch.org
    DocumentRoot /opt/bitnami/apache/htdocs
    
    # Redirect HTTP to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName www.aidsquilttouch.org
    DocumentRoot /opt/bitnami/apache/htdocs
    
    # SSL Configuration (Bitnami manages these automatically)
    SSLEngine on
    SSLCertificateFile "/opt/bitnami/apache/conf/bitnami/certs/server.crt"
    SSLCertificateKeyFile "/opt/bitnami/apache/conf/bitnami/certs/server.key"
    
    # Security Headers
    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options DENY
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
    
    # Static file exclusions MUST come first
    ProxyPass /readmyname/uploads !
    
    # Specific API endpoints
    ProxyPass /readmyname/ws ws://127.0.0.1:3100/ws
    ProxyPassReverse /readmyname/ws ws://127.0.0.1:3100/ws
    
    ProxyPass /readmyname/api/recordings/upload http://127.0.0.1:3100/api/recordings/upload
    ProxyPassReverse /readmyname/api/recordings/upload http://127.0.0.1:3100/api/recordings/upload
    
    # General application proxy (MUST be last)
    ProxyPass /readmyname/ http://127.0.0.1:3100/
    ProxyPassReverse /readmyname/ http://127.0.0.1:3100/
    
    # Serve static audio files directly from filesystem
    Alias /readmyname/uploads /home/bitnami/readmyname/uploads
    
    <Location "/readmyname">
        ProxyPreserveHost On
        
        # Set headers for the proxied application
        ProxySetHeader Host $host
        ProxySetHeader X-Real-IP $remote_addr
        ProxySetHeader X-Forwarded-For $proxy_add_x_forwarded_for
        ProxySetHeader X-Forwarded-Proto $scheme
        ProxySetHeader X-Forwarded-Prefix "/readmyname"
    </Location>
    
    <Location "/readmyname/api/recordings/upload">
        # Allow large file uploads (100MB)
        LimitRequestBody 104857600
        
        # Increase timeout for uploads
        ProxyTimeout 300
    </Location>
    
    <Directory "/home/bitnami/readmyname/uploads">
            Options -Indexes
            AllowOverride None
            Require all granted
            
            # Only allow audio files
            <FilesMatch "\.(mp3|wav|m4a|ogg)$">
                Header set Cache-Control "max-age=3600, public"
                Header set Access-Control-Allow-Origin "*"
            </FilesMatch>
            
            # Block all other file types
            <FilesMatch "\.(?!mp3|wav|m4a|ogg$)[^.]+$">
                Require all denied
            </FilesMatch>
        </Directory>
    
    # Your existing site content continues to work normally
    <Location "/">
        # Your existing DocumentRoot serves from here
        # This ensures your main site continues to work
    </Location>
</VirtualHost>

# Optional: Staging Virtual Host - staging.aidsquilttouch.org
<VirtualHost *:443>
    ServerName staging.aidsquilttouch.org
    DocumentRoot /opt/bitnami/apache/htdocs
    
    # SSL Configuration
    SSLEngine on
    SSLCertificateFile "/opt/bitnami/apache/conf/bitnami/certs/server.crt"
    SSLCertificateKeyFile "/opt/bitnami/apache/conf/bitnami/certs/server.key"
    
    # Read My Name Staging Application
    ProxyPass /readmyname/ http://127.0.0.1:3101/
    ProxyPassReverse /readmyname/ http://127.0.0.1:3101/
    
    <Location "/readmyname">
        ProxyPreserveHost On
        
        # Staging runs on port 3101
        ProxySetHeader Host $host
        ProxySetHeader X-Real-IP $remote_addr
        ProxySetHeader X-Forwarded-For $proxy_add_x_forwarded_for
        ProxySetHeader X-Forwarded-Proto $scheme
        ProxySetHeader X-Forwarded-Prefix "/readmyname"
    </Location>
    
    # Password protect staging
    <Location "/readmyname">
        AuthType Basic
        AuthName "Staging Environment"
        AuthUserFile /opt/bitnami/apache/conf/.htpasswd-staging
        Require valid-user
    </Location>
</VirtualHost>

# Logging
LogFormat "%h %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\" %D" combined_with_time
CustomLog /opt/bitnami/apache/logs/readmyname_access.log combined_with_time
ErrorLog /opt/bitnami/apache/logs/readmyname_error.log