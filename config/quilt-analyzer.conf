<VirtualHost *:80>
  ServerName aidsquilttouch.org
  ServerAlias www.aidsquilttouch.org
  
  # Redirect HTTP to HTTPS
  RewriteEngine On
  RewriteCond %{HTTPS} off
  RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
  ServerName www.aidsquilttouch.org
  ServerAlias aidsquilttouch.org
  DocumentRoot /opt/bitnami/apache/htdocs
  
  # SSL Configuration
  SSLEngine on
  SSLCertificateFile /opt/bitnami/apache/conf/bitnami/certs/server.crt
  SSLCertificateKeyFile /opt/bitnami/apache/conf/bitnami/certs/server.key
  
  # Enable URL rewriting
  RewriteEngine On

  # Security Headers
  Header always set X-Content-Type-Options nosniff
  Header always set X-Frame-Options DENY
  Header always set X-XSS-Protection "1; mode=block"
  Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
  
  # Redirect /readmyname to /readmyname/ (add trailing slash)
  RewriteRule ^/readmyname$ /readmyname/ [R=301,L]

  # AIDS Quilt Analyzer proxy
  ProxyPass /aids-quilt-analyzer/ http://localhost:3002/aids-quilt-analyzer/
  ProxyPassReverse /aids-quilt-analyzer/ http://localhost:3002/aids-quilt-analyzer/
  
  # Read My Name application proxy
  ProxyPass /readmyname/uploads !
  ProxyPass /readmyname/ws ws://127.0.0.1:3100/readmyname/ws
  ProxyPassReverse /readmyname/ws ws://127.0.0.1:3100/readmyname/ws
  ProxyPass /readmyname/api/recordings/upload http://127.0.0.1:3100/readmyname/api/recordings/upload
  ProxyPassReverse /readmyname/api/recordings/upload http://127.0.0.1:3100/readmyname/api/recordings/upload
  ProxyPass /readmyname/ http://127.0.0.1:3100/readmyname/
  ProxyPassReverse /readmyname/ http://127.0.0.1:3100/readmyname/
  
  # Static uploads for readmyname
  Alias /readmyname/uploads /home/bitnami/readmyname/uploads
  <Directory "/home/bitnami/readmyname/uploads">
    Options -Indexes
    AllowOverride None
    Require all granted
    <FilesMatch "\.(mp3|wav|m4a|ogg)$">
      Header set Cache-Control "max-age=3600, public"
      Header set Access-Control-Allow-Origin "*"
    </FilesMatch>
  </Directory>
  
  ProxyPreserveHost On
  ProxyRequests Off
  
  LogLevel debug
  ErrorLog /opt/bitnami/apache/logs/combined_error.log
  CustomLog /opt/bitnami/apache/logs/combined_access.log combined
</VirtualHost>
